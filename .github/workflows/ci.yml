name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Check Homebrew cask syntax
        run: ruby -c Casks/along.rb
      - name: Test geometry and window recovery
        run: ./Scripts/test.sh
      - name: Build Apple Silicon app
        run: CONFIGURATION=release ./Scripts/build-app.sh
      - name: Verify bundle
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          ./Scripts/verify-release.sh build/Along.app "$version"
      - name: Archive preview build
        run: ditto -c -k --sequesterRsrc --keepParent build/Along.app build/Along-ci-apple-silicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Along-ci-apple-silicon
          path: build/Along-ci-apple-silicon.zip
          if-no-files-found: error
